<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1410" />
    <meta name="description" content="スマホで遊べる掘り進みアクション" />
    <title>depth-driller — 掘って潜る</title>
  </head>
  <body>
    <div id="app">
      <div id="stage">
        <canvas id="board"></canvas>
        <div id="hud"><span id="depth">0</span> m</div>
        <div id="overlay" hidden>
          <p class="overlay-title">つぶされた</p>
          <p class="overlay-depth"><span id="final-depth">0</span> m</p>
          <button id="retry" type="button">もう一度</button>
        </div>
      </div>
      <div id="pad">
        <div class="pad-cross">
          <span class="pad-key pad-up" data-dir="up">▲</span>
          <span class="pad-key pad-left" data-dir="left">◀</span>
          <span class="pad-key pad-center"></span>
          <span class="pad-key pad-right" data-dir="right">▶</span>
          <span class="pad-key pad-down" data-dir="down">▼</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
